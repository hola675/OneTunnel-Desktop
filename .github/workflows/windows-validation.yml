name: Windows validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/f1-xray-foundation, feat/f6-traffic-rules-foundation]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Check Windows PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Rust format audit
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Verify committed dependency lockfile
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps > $null
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
