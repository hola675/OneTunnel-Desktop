name: Windows validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/f1-xray-foundation, feat/f6-traffic-rules-foundation]

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Rust format audit
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Format Rust for compile diagnostics
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit formatting to development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/f6-traffic-rules-foundation'
        shell: pwsh
        run: |
          git add src-tauri/src
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(rust): apply rustfmt to F1 core"
            git push origin HEAD:refs/heads/feat/f6-traffic-rules-foundation
          }
      - name: Verify committed dependency lockfile
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 --no-deps > $null
      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
